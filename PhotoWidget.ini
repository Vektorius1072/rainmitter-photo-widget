[Rainmeter]
SkinWidth=300
SkinHeight=300
DynamicWindowSize=0
Update=16
MouseLeaveAction=[!CommandMeasure mLua "Release()"]

[Metadata]
Name=Photo Widget (iOS style)
Author=OpenAI
Version=4.1
Information=Vertical photo gallery with live drag (cursor tracking via hover strips), smooth settling and a rounded clipping viewport.

[Variables]
Folder= //сюда вставить путь к папке с фото
W=300
H=300
R=28
Interval=10
ShrinkScale=0.72
Gap=10
ShrinkTime=0.24
SlideTime=0.42
Threshold=35
DragFollow=90
Shuffle=0
BgColor=58,58,60

[mScan]
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
Parameter=/c chcp 65001 >nul & dir /b /a-d /on "#Folder#\*" > "#CURRENTPATH#files.txt"
State=Hide
OutputType=ANSI
UpdateDivider=-1
FinishAction=[!CommandMeasure mLua "Loaded()"]

[mLua]
Measure=Script
ScriptFile=#CURRENTPATH#PhotoWidget.lua

; Visible background appears only while the gallery is reduced.
[MeterBg]
Meter=Shape
X=0
Y=0
W=#W#
H=#H#
Shape=Rectangle 0,0,#W#,#H#,#R# | Fill Color #BgColor#,0 | StrokeWidth 0

; This Shape is a clipping mask. Container meters are intentionally not drawn.
[MeterViewport]
Meter=Shape
X=0
Y=0
W=#W#
H=#H#
Shape=Rectangle 0,0,#W#,#H#,#R# | Fill Color 255,255,255,255 | StrokeWidth 0

; First content meter: positioned relative to the viewport's top-left corner.
[ImgPrev]
Meter=Image
Group=PhotoSlots
Container=MeterViewport
X=0
Y=0
W=#W#
H=#H#
PreserveAspectRatio=2
ImageAlpha=0

; Positions of all three slots are set from Lua (absolute coordinates).
[ImgCurrent]
Meter=Image
Group=PhotoSlots
Container=MeterViewport
X=0
Y=0
W=#W#
H=#H#
PreserveAspectRatio=2

[ImgNext]
Meter=Image
Group=PhotoSlots
Container=MeterViewport
X=0
Y=0
W=#W#
H=#H#
PreserveAspectRatio=2
ImageAlpha=0

; ---------------------------------------------------------------
; Слежение за курсором: Rainmeter не умеет сообщать координаты мыши
; при движении, поэтому поверх виджета лежат 75 тонких полосок.
; Каждая сообщает скрипту, когда курсор въехал в неё (MouseOverAction).
; Полоски заменяют общий слой MeterHit и несут все действия мыши.
; ---------------------------------------------------------------

[Strip0]
Meter=Shape
X=0
Y=(0*#H#/75)
Shape=Rectangle 0,0,#W#,5 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!CommandMeasure mLua "Hover(0)"]
LeftMouseDownAction=[!CommandMeasure mLua "DownS(0,$MouseX$,$MouseY$)"]
LeftMouseUpAction=[!CommandMeasure mLua "UpS(0,$MouseX$,$MouseY$)"]
MouseScrollUpAction=[!CommandMeasure mLua "Step(-1)"]
MouseScrollDownAction=[!CommandMeasure mLua "Step(1)"]
MiddleMouseUpAction=[!CommandMeasure mLua "Reload()"]

